<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pollybuzz-sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17121D;
    --bg-panel: #1F1828;
    --bg-bubble-char: #2A2233;
    --bg-bubble-user: #33202B;
    --text: #F1EAE3;
    --text-muted: #9C8FAE;
    --accent: #E8577A;
    --accent-2: #5FBFA0;
    --border: #362C42;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }
  .app { display: flex; height: 100vh; }

  /* --- sidebar --- */
  .sidebar {
    width: 260px; flex-shrink: 0; background: var(--bg-panel);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .sidebar-header { padding: 20px 18px 8px; }
  .sidebar-header h1 { font-size: 18px; font-weight: 700; margin: 0; }
  .sidebar-header p { font-size: 12px; color: var(--text-muted); margin: 4px 0 0; }
  .char-list { flex: 1; overflow-y: auto; padding: 8px; }
  .char-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 10px;
    border-radius: 10px; cursor: pointer; margin-bottom: 4px;
  }
  .char-item:hover { background: rgba(255,255,255,0.04); }
  .char-item.active { background: rgba(232,87,122,0.14); }
  .char-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--bg-bubble-char);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: 14px; flex-shrink: 0; border: 1px solid var(--border);
  }
  .char-item.active .char-avatar { border-color: var(--accent); color: var(--accent); }
  .char-name { font-size: 14px; font-weight: 500; }
  .char-tags { font-size: 11px; color: var(--text-muted); }
  .new-char-btn {
    margin: 8px; padding: 10px; border-radius: 10px; border: 1px dashed var(--border);
    background: transparent; color: var(--text-muted); font-family: inherit; font-size: 13px;
    cursor: pointer;
  }
  .new-char-btn:hover { border-color: var(--accent); color: var(--text); }

  /* --- main pane --- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .chat-header h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .chat-header p { margin: 2px 0 0; font-size: 12px; color: var(--text-muted); }
  .memory-toggle {
    font-family: inherit; font-size: 12px; color: var(--accent-2); background: transparent;
    border: 1px solid var(--accent-2); border-radius: 20px; padding: 6px 12px; cursor: pointer;
  }

  .memory-panel {
    display: none; padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: rgba(95,191,160,0.05); flex-wrap: wrap; gap: 6px;
  }
  .memory-panel.open { display: flex; }
  .memory-empty { font-size: 12px; color: var(--text-muted); }
  .chip {
    font-size: 12px; padding: 5px 10px; border-radius: 20px; background: rgba(95,191,160,0.15);
    color: var(--accent-2); border: 1px solid rgba(95,191,160,0.35);
  }
  .chip.pref { background: rgba(232,87,122,0.12); color: var(--accent); border-color: rgba(232,87,122,0.3); }

  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 68%; padding: 11px 15px; border-radius: 14px; font-size: 14.5px; line-height: 1.55;
  }
  .bubble-row.character .bubble { background: var(--bg-bubble-char); border-bottom-left-radius: 4px; }
  .bubble-row.user .bubble { background: var(--bg-bubble-user); border-bottom-right-radius: 4px; }

  .composer { padding: 16px 24px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .composer textarea {
    flex: 1; resize: none; background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-family: inherit; font-size: 14px;
    padding: 12px 14px; height: 46px;
  }
  .composer textarea:focus { outline: none; border-color: var(--accent); }
  .composer button {
    background: var(--accent); color: #1B0E12; border: none; border-radius: 12px;
    padding: 0 20px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .composer button:disabled { opacity: 0.4; cursor: default; }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: 14px; text-align: center; padding: 40px;
  }

  /* --- new character modal --- */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(10,7,13,0.7);
    align-items: center; justify-content: center; z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; width: 380px; max-width: 90vw;
  }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .modal label { font-size: 12px; color: var(--text-muted); display: block; margin: 12px 0 4px; }
  .modal input, .modal textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: inherit; font-size: 13px; padding: 8px 10px;
  }
  .modal textarea { resize: vertical; min-height: 54px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal-actions button {
    font-family: inherit; font-size: 13px; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--text);
  }
  .modal-actions button.primary { background: var(--accent); color: #1B0E12; border: none; font-weight: 700; }

  .footnote {
    font-size: 11px; color: var(--text-muted); text-align: center; padding: 0 24px 10px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>pollybuzz-sim</h1>
      <p>mock LLM &middot; in-browser demo</p>
    </div>
    <div class="char-list" id="charList"></div>
    <button class="new-char-btn" id="newCharBtn">+ New character</button>
  </div>

  <div class="main">
    <div id="emptyState" class="empty-state">Pick a character on the left to start chatting.</div>

    <div id="chatArea" style="display:none; flex:1; min-height:0; flex-direction:column;">
      <div class="chat-header">
        <div>
          <h2 id="charName"></h2>
          <p id="charTagline"></p>
        </div>
        <button class="memory-toggle" id="memoryToggle">memory</button>
      </div>
      <div class="memory-panel" id="memoryPanel"></div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <textarea id="composerInput" placeholder="Type a message..."></textarea>
        <button id="sendBtn">Send</button>
      </div>
      <div class="footnote">Responses are a mock LLM for demo purposes -- see index.html to wire up a real model.</div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>New character</h3>
    <label>Name</label>
    <input id="newName" placeholder="e.g. Juniper">
    <label>Persona</label>
    <textarea id="newPersona" placeholder="Who are they? What's their personality?"></textarea>
    <label>Greeting</label>
    <input id="newGreeting" placeholder="First line they say">
    <label>Tags (comma separated)</label>
    <input id="newTags" placeholder="e.g. fantasy, playful">
    <div class="modal-actions">
      <button id="cancelNew">Cancel</button>
      <button class="primary" id="createNew">Create</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Same design as the Python cli.py: characters, chat, and a
   structured-profile memory service. No backend, no network --
   everything lives in memory for this browser tab (refreshing
   the page resets it). See the README section at the bottom of
   this file for how to wire up a real model.
   ============================================================ */

const RAW_WINDOW = 10;          // recent turns injected verbatim
const SUMMARIZE_TRIGGER = 10;   // new messages before folding into the profile
const MAX_FACTS_PER_BUCKET = 12;

let characters = [];
let messages = {};   // charId -> [{role: 'user'|'character', content}]
let profiles = {};   // charId -> {facts, preferences, notes, lastSummarizedIndex}
let activeCharId = null;

function uid() { return Math.random().toString(36).slice(2, 10); }

function seed() {
  characters = [
    { id: uid(), name: "Nova", tags: ["scifi", "playful"],
      persona: "A playful, upbeat AI companion from a space station in 2190. Curious about Earth culture, quick with a joke.",
      greeting: "Hey there! I'm Nova. What's it like down on your planet today?" },
    { id: uid(), name: "Master Elin", tags: ["fantasy", "wise"],
      persona: "A wise, calm mentor figure from a fantasy world, speaks in measured, thoughtful sentences and often references nature.",
      greeting: "Welcome, traveler. Sit a while -- tell me what's on your mind." },
  ];
  characters.forEach(c => { messages[c.id] = []; profiles[c.id] = emptyProfile(); });
}

function emptyProfile() {
  return { facts: [], preferences: [], notes: [], lastSummarizedIndex: 0 };
}

/* ---- mock LLM: mirrors llm.py's MockLLM ---- */
function mockChat(character, history, userText) {
  const flavor = /playful/i.test(character.persona) ? "*grins*"
    : /wise/i.test(character.persona) ? "*nods thoughtfully*" : "*smiles*";
  return `${flavor} ${character.name} here -- you said: "${userText.trim()}". Tell me more about that.`;
}

function extractAndMergeMemory(transcriptLines) {
  const facts = [], prefs = [];
  const patterns = [
    [/I(?:'m| am) ([^.!?]+)/i, facts],
    [/I (?:like|love|enjoy) ([^.!?]+)/i, prefs],
    [/I (?:hate|dislike|don't like) ([^.!?]+)/i, prefs],
  ];
  transcriptLines.forEach(line => {
    if (!line.startsWith("user:")) return;
    const text = line.slice(5).trim();
    for (const [re, bucket] of patterns) {
      const m = text.match(re);
      if (m) { bucket.push(m[0].trim()); break; }
    }
  });
  return { facts, preferences: prefs, notes: [] };
}

function dedupCap(items) {
  const seen = new Set(), out = [];
  for (const item of items) {
    const key = item.toLowerCase().trim();
    if (key && !seen.has(key)) { seen.add(key); out.push(item); }
  }
  return out.slice(-MAX_FACTS_PER_BUCKET);
}

function profileAsPromptBlock(p) {
  if (!p.facts.length && !p.preferences.length && !p.notes.length) {
    return "(No memory yet -- this is a new relationship.)";
  }
  const lines = [];
  if (p.facts.length) lines.push("Facts: " + p.facts.join("; "));
  if (p.preferences.length) lines.push("Preferences: " + p.preferences.join("; "));
  if (p.notes.length) lines.push("Ongoing notes: " + p.notes.join("; "));
  return lines.join("\n");
}

function maybeSummarize(charId) {
  const profile = profiles[charId];
  const all = messages[charId];
  const newMsgs = all.slice(profile.lastSummarizedIndex);
  if (newMsgs.length < SUMMARIZE_TRIGGER) return;

  const transcript = newMsgs.map(m => `${m.role === 'user' ? 'user' : 'character'}: ${m.content}`);
  const merged = extractAndMergeMemory(transcript);
  profile.facts = dedupCap(profile.facts.concat(merged.facts));
  profile.preferences = dedupCap(profile.preferences.concat(merged.preferences));
  profile.notes = dedupCap(profile.notes.concat(merged.notes));
  profile.lastSummarizedIndex = all.length;
}

function sendMessage(charId, userText) {
  const character = characters.find(c => c.id === charId);
  const profile = profiles[charId];
  const recent = messages[charId].slice(-RAW_WINDOW);

  const reply = mockChat(character, recent, userText);

  messages[charId].push({ role: 'user', content: userText });
  messages[charId].push({ role: 'character', content: reply });

  maybeSummarize(charId);
  return reply;
}

/* ---- rendering ---- */
function renderCharList() {
  const el = document.getElementById('charList');
  el.innerHTML = '';
  characters.forEach(c => {
    const div = document.createElement('div');
    div.className = 'char-item' + (c.id === activeCharId ? ' active' : '');
    div.innerHTML = `
      <div class="char-avatar">${c.name.slice(0, 1)}</div>
      <div>
        <div class="char-name">${escapeHtml(c.name)}</div>
        <div class="char-tags">${c.tags.join(' &middot; ')}</div>
      </div>`;
    div.onclick = () => openChat(c.id);
    el.appendChild(div);
  });
}

function openChat(charId) {
  activeCharId = charId;
  const character = characters.find(c => c.id === charId);
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('chatArea').style.display = 'flex';
  document.getElementById('charName').textContent = character.name;
  document.getElementById('charTagline').textContent = character.tags.join(' \u00b7 ');
  document.getElementById('memoryPanel').classList.remove('open');

  if (messages[charId].length === 0) {
    messages[charId].push({ role: 'character', content: character.greeting });
  }
  renderCharList();
  renderMessages();
  renderMemory();
}

function renderMessages() {
  const el = document.getElementById('messages');
  el.innerHTML = '';
  messages[activeCharId].forEach(m => {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (m.role === 'user' ? 'user' : 'character');
    row.innerHTML = `<div class="bubble">${escapeHtml(m.content)}</div>`;
    el.appendChild(row);
  });
  el.scrollTop = el.scrollHeight;
}

function renderMemory() {
  const p = profiles[activeCharId];
  const el = document.getElementById('memoryPanel');
  el.innerHTML = '';
  if (!p.facts.length && !p.preferences.length && !p.notes.length) {
    el.innerHTML = '<span class="memory-empty">No memory yet -- this is a new relationship.</span>';
    return;
  }
  p.facts.forEach(f => el.appendChild(chip(f, false)));
  p.preferences.forEach(f => el.appendChild(chip(f, true)));
  p.notes.forEach(f => el.appendChild(chip(f, false)));
}

function chip(text, isPref) {
  const span = document.createElement('span');
  span.className = 'chip' + (isPref ? ' pref' : '');
  span.textContent = text;
  return span;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---- events ---- */
document.getElementById('sendBtn').onclick = handleSend;
document.getElementById('composerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

function handleSend() {
  const input = document.getElementById('composerInput');
  const text = input.value.trim();
  if (!text || !activeCharId) return;
  sendMessage(activeCharId, text);
  input.value = '';
  renderMessages();
  renderMemory();
}

document.getElementById('memoryToggle').onclick = () => {
  document.getElementById('memoryPanel').classList.toggle('open');
};

document.getElementById('newCharBtn').onclick = () => document.getElementById('overlay').classList.add('open');
document.getElementById('cancelNew').onclick = () => document.getElementById('overlay').classList.remove('open');
document.getElementById('createNew').onclick = () => {
  const name = document.getElementById('newName').value.trim();
  const persona = document.getElementById('newPersona').value.trim();
  const greeting = document.getElementById('newGreeting').value.trim() || `Hi, I'm ${name}.`;
  const tags = document.getElementById('newTags').value.split(',').map(t => t.trim()).filter(Boolean);
  if (!name || !persona) { alert('Name and persona are required.'); return; }

  const c = { id: uid(), name, persona, greeting, tags };
  characters.unshift(c);
  messages[c.id] = [];
  profiles[c.id] = emptyProfile();

  ['newName', 'newPersona', 'newGreeting', 'newTags'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('overlay').classList.remove('open');
  renderCharList();
  openChat(c.id);
};

seed();
renderCharList();
</script>
</body>
</html>
